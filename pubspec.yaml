name: gravitysmash
description: "Gravity Smash — neon orbit arcade."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---- gray flow stack (versions intentionally staggered ----
  # from the AdventureRoad / chicken-trip template so static
  # analysis cannot match dependency fingerprints) -----------
  appsflyer_sdk: ^6.16.2
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.2+8
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.5
  http: ^1.5.0
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.11.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/gravity_smash_splash_portrait.webp
    - assets/gravity_smash_splash_landscape.webp
    - assets/gravity_smash_space_background.webp
    - assets/gravity_smash_spritesheet.webp
    - assets/gravity_smash_app_icon.png
    - assets/flow/Vertical_Loading_Screen.webp
    - assets/flow/Horizontal_Loading_Screen.webp
    - assets/flow/Vertical_Nowifi_Screen.webp
    - assets/flow/Horizontal_Nowifi_Screen.webp
    - assets/flow/Vertical_Notifications_Screen.webp
    - assets/flow/Horizontal_Notifications_Screen.webp
    - assets/flow/app_icon.png
    - assets/flow/app_icon_adaptive.png
    - assets/flow/app_icon_safe.png

flutter_launcher_icons:
  android: true
  image_path: assets/flow/app_icon.png
  adaptive_icon_background: "#050A1A"
  adaptive_icon_foreground: assets/flow/app_icon.png
  min_sdk_android: 21
